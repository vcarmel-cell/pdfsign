<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>מילוי טופס</title>
<style>
  :root { --primary: #2563eb; --primary-dark: #1d4ed8; --danger: #dc2626; --border: #d1d5db; --bg: #f3f4f6; --text: #111827; --text-muted: #6b7280; }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; margin: 0; background: var(--bg); color: var(--text); }
  header { background: #111827; color: white; padding: .9rem 1.2rem; }
  header h1 { font-size: 1.1rem; margin: 0; }
  main { max-width: 960px; margin: 0 auto; padding: 1rem 1rem 6rem 1rem; overflow-x: auto; }
  .card { background: white; border: 1px solid var(--border); border-radius: 10px; padding: 1.4rem; max-width: 420px; margin: 3rem auto; text-align: center; }
  button { background: var(--primary); color: white; border: none; border-radius: 6px; padding: .6rem 1.1rem; font-size: .95rem; cursor: pointer; }
  button:hover { background: var(--primary-dark); }
  input[type=text] { width: 100%; padding: .55rem .7rem; border: 1px solid var(--border); border-radius: 6px; font-size: .95rem; margin: .8rem 0; }
  .error { color: var(--danger); font-size: .88rem; }

  .modal { position: fixed; inset: 0; background: rgba(17,24,39,.55); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1rem; }
  .modal-box { background: white; border-radius: 12px; padding: 1.6rem; max-width: 380px; width: 100%; text-align: center; }

  .page-wrapper { position: relative; margin: 0 auto 2rem auto; background: #fff; border: 1px solid var(--border); }
  .page-wrapper canvas { display: block; }

  .fill-field-box { position: absolute; display: flex; align-items: center; }
  .fill-field-label {
    position: absolute; top: -17px; right: 0; font-size: 10px; background: #fff; padding: 0 4px;
    border-radius: 3px; color: #374151; white-space: nowrap; box-shadow: 0 0 0 1px #e5e7eb;
  }
  .fill-input {
    width: 100%; height: 24px; max-height: 100%; border: 1px solid var(--primary); border-radius: 3px;
    padding: 0 4px; font-size: 12px; background: rgba(37,99,235,.06); box-sizing: border-box; font-family: inherit;
  }
  .fill-checkbox { width: 100%; height: 100%; align-self: stretch; cursor: pointer; accent-color: var(--primary); }
  .signature-canvas {
    width: 100%; height: 100%; align-self: stretch; border: 1.5px dashed #7c3aed; border-radius: 4px;
    background: rgba(124,58,237,.05); touch-action: none; display: block;
  }
  .sig-clear-btn {
    position: absolute; left: 2px; bottom: 2px; font-size: 9px; padding: 2px 6px;
    background: #7c3aed; border-radius: 4px;
  }
  .fill-readonly-value {
    width: 100%; height: 100%; display: flex; align-items: center; padding: 0 4px;
    background: rgba(107,114,128,.1); border: 1px solid var(--border); border-radius: 3px;
    font-size: 12px; color: var(--text); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; box-sizing: border-box;
  }
  .signed-image { width: 100%; height: 100%; object-fit: contain; }
  .pending-signature {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    background: rgba(107,114,128,.1); border: 1.5px dashed var(--border); border-radius: 4px;
    font-size: 10px; color: var(--text-muted); text-align: center; padding: 2px; box-sizing: border-box;
  }

  .submit-bar {
    position: fixed; bottom: 0; right: 0; left: 0; background: white; border-top: 1px solid var(--border);
    padding: .8rem 1rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
  }
  .submit-bar .error { flex: 1; margin: 0; }
  #download-link {
    display: inline-block; margin-top: 1rem; background: var(--primary); color: white;
    padding: .6rem 1.2rem; border-radius: 6px; text-decoration: none;
  }
</style>
</head>
<body>

<header><h1 id="page-title">מילוי טופס</h1></header>

<main>
  <div id="view-loading"><p style="text-align:center; margin-top:3rem;">טוען...</p></div>

  <div id="view-invalid" style="display:none">
    <div class="card"><p>הקישור אינו תקף, או שהטופס אינו פעיל יותר.</p></div>
  </div>

  <div id="view-fill" style="display:none">
    <div id="fill-pages"></div>
    <div class="submit-bar">
      <p id="validation-error" class="error"></p>
      <button type="button" id="submit-btn">שליחת הטופס</button>
    </div>
  </div>

  <div id="view-submitting" style="display:none">
    <p style="text-align:center; margin-top:3rem;">שולח את הטופס, נא להמתין...</p>
  </div>

  <div id="view-success" style="display:none">
    <div class="card">
      <h2 id="success-title">הטופס נשלח בהצלחה</h2>
      <p>תודה, <span id="success-name"></span>!</p>
      <p id="success-status"></p>
      <a id="download-link">הורדת עותק אישי</a>
      <p id="success-note" class="error"></p>
    </div>
  </div>
</main>

<div id="view-name-modal" class="modal" style="display:none">
  <div class="modal-box">
    <h2 id="name-modal-title"></h2>
    <p>לפני מילוי הטופס, נא הזינו את שמכם המלא:</p>
    <input type="text" id="filler-name-input" placeholder="שם מלא" />
    <p id="name-error" class="error"></p>
    <button type="button" id="start-fill-btn">המשך למילוי</button>
  </div>
</div>

<script src="js/firebase-init.js"></script>
<script src="js/pdf-field-utils.js"></script>
<script>
let db, auth, storage;
let template = null;
let templateId = null;
let fillerName = '';
// כתובת המייל של הנמען, אם הקישור הגיע מהזמנה בקבוצה (fill.html?...&e=...) -
// מאפשרת למנהל לבדוק מי הגיב, בלי לדרוש מהממלא להקליד אותה בעצמו.
let invitedEmail = null;
let pdfDocJs = null;
const pageBoxSizes = {};
let fieldRuntime = {};
let flattenedBytesCache = null;
// כשלא null: {submissionId, signerFieldId, data} - מצב "מסמך רב-חותמים"
// (כמה אנשים חותמים על אותו מסמך משותף, לא עותק עצמאי לכל אחד).
let multiSign = null;

function showView(name) {
  ['loading', 'invalid', 'fill', 'submitting', 'success'].forEach(v => {
    document.getElementById('view-' + v).style.display = (v === name) ? 'block' : 'none';
  });
  document.getElementById('view-name-modal').style.display = (name === 'name-modal') ? 'flex' : 'none';
}

// ─── רינדור המסמך ומיקום שדות אינטראקטיביים ──────────────
async function renderFillDocument() {
  pdfDocJs = await loadPdfDocument(await getPdfBytes(template));
  const container = document.getElementById('fill-pages');
  container.innerHTML = '';
  fieldRuntime = {};

  for (let i = 0; i < template.pageCount; i++) {
    const page = await pdfDocJs.getPage(i + 1);
    const wrapper = document.createElement('div');
    wrapper.className = 'page-wrapper';
    const canvas = document.createElement('canvas');
    wrapper.appendChild(canvas);
    container.appendChild(wrapper);

    // רוחב מינימלי כדי שהשדות (בגדלים קבועים בפיקסלים) לא ייצטופפו זה על זה
    // במסכי טלפון צרים - גלילה אופקית + הגדלה במגע (pinch-zoom) פתוחות במקום.
    const cssWidth = Math.min(Math.max(container.clientWidth || 900, 600), 900);
    const boxSize = await renderPdfPageToCanvas(page, canvas, cssWidth);
    wrapper.style.width = boxSize.cssWidth + 'px';
    wrapper.style.height = boxSize.cssHeight + 'px';
    pageBoxSizes[i] = boxSize;

    (template.fields || []).filter(f => f.page === i).forEach(field => {
      const rectPx = pctRectToPx(field, boxSize.cssWidth, boxSize.cssHeight);
      wrapper.appendChild(multiSign ? createMultiSignFieldEl(field, rectPx) : createFillFieldEl(field, rectPx));
    });
  }
}

function createFillFieldEl(field, rectPx) {
  const box = document.createElement('div');
  box.className = 'fill-field-box';
  applyRectPx(box, rectPx);

  const labelTag = document.createElement('div');
  labelTag.className = 'fill-field-label';
  labelTag.textContent = field.label + (field.required ? ' *' : '');
  box.appendChild(labelTag);

  if (field.type === 'text' || field.type === 'date' || field.type === 'number') {
    const input = document.createElement('input');
    input.type = field.type === 'date' ? 'date' : (field.type === 'number' ? 'number' : 'text');
    if (field.type === 'number') input.inputMode = 'numeric';
    input.className = 'fill-input';
    box.appendChild(input);
    fieldRuntime[field.id] = {
      isFilled: () => input.value.trim() !== '',
      getStamp: () => ({ kind: 'text', value: input.value.trim() })
    };
  } else if (field.type === 'checkbox') {
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.className = 'fill-checkbox';
    box.appendChild(input);
    fieldRuntime[field.id] = {
      isFilled: () => input.checked,
      getStamp: () => ({ kind: 'checkbox', checked: input.checked })
    };
  } else if (field.type === 'signature') {
    const canvas = document.createElement('canvas');
    canvas.className = 'signature-canvas';
    box.appendChild(canvas);
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'sig-clear-btn';
    clearBtn.textContent = 'נקה';
    box.appendChild(clearBtn);

    let pad = null;
    requestAnimationFrame(() => { pad = initSignaturePad(canvas); });
    clearBtn.addEventListener('click', () => { if (pad) pad.clear(); });

    fieldRuntime[field.id] = {
      isFilled: () => !!(pad && pad.hasDrawn()),
      getStamp: () => ({ kind: 'signature', dataUrl: pad ? pad.getDataURL() : null })
    };
  }

  return box;
}

// ─── שדות במסמך רב-חותמים: ערכים משותפים לקריאה בלבד אחרי שמישהו כבר
// מילא אותם, וחתימות של חותמים אחרים מוצגות כתמונה (לא ניתנות לעריכה). ───
function createMultiSignFieldEl(field, rectPx) {
  const sub = multiSign.data;

  // זו החתימה שלי, או ערך משותף שעדיין לא מולא - מתנהג בדיוק כמו מצב single רגיל.
  if (field.type === 'signature' && field.id === multiSign.signerFieldId) {
    return createFillFieldEl(field, rectPx);
  }
  if (field.type !== 'signature' && !(sub.values && Object.prototype.hasOwnProperty.call(sub.values, field.id))) {
    return createFillFieldEl(field, rectPx);
  }

  // אחרת: שדה לקריאה בלבד (כבר מולא/נחתם ע"י מישהו אחר).
  const box = document.createElement('div');
  box.className = 'fill-field-box';
  applyRectPx(box, rectPx);
  const labelTag = document.createElement('div');
  labelTag.className = 'fill-field-label';
  labelTag.textContent = field.label;
  box.appendChild(labelTag);

  if (field.type === 'signature') {
    const rawSig = (sub.rawSignatures || {})[field.id];
    if (rawSig) {
      const img = document.createElement('img');
      img.className = 'signed-image';
      img.src = 'data:image/png;base64,' + rawSig;
      box.appendChild(img);
    } else {
      const placeholder = document.createElement('div');
      placeholder.className = 'pending-signature';
      placeholder.textContent = 'ממתין לחתימת ' + field.label;
      box.appendChild(placeholder);
    }
  } else {
    const readonly = document.createElement('div');
    readonly.className = 'fill-readonly-value';
    readonly.textContent = field.type === 'checkbox' ? (sub.values[field.id] ? '✓' : '—') : String(sub.values[field.id]);
    box.appendChild(readonly);
  }

  fieldRuntime[field.id] = { isFilled: () => true, getStamp: null, readOnly: true };
  return box;
}

function validateRequired() {
  const missing = [];
  (template.fields || []).forEach(field => {
    if (!field.required) return;
    const rt = fieldRuntime[field.id];
    if (!rt || !rt.isFilled()) missing.push(field.label);
  });
  return missing;
}

// renderTextToPngDataUrl ו-flattenPdf עברו ל-js/pdf-field-utils.js כדי
// שגם admin.html (כפתור "נסה שוב להשלים") יוכל להשתמש בהן.

// ─── שליחת הטופס: מצב single (עותק עצמאי לכל ממלא, ללא שינוי בהתנהגות) ───
document.getElementById('submit-btn').addEventListener('click', () => {
  if (multiSign) submitMultiSignMode(); else submitSingleMode();
});

async function submitSingleMode() {
  const errorEl = document.getElementById('validation-error');
  const missing = validateRequired();
  if (missing.length) {
    errorEl.textContent = 'נא למלא: ' + missing.join(', ');
    return;
  }
  errorEl.textContent = '';
  showView('submitting');

  try {
    // מכסת 99 הגשות - רלוונטית רק לבעלים שהם משתמשים רגילים (יש להם מסמך
    // users/{uid}); למנהל-העל אין מסמך כזה ולכן אין הגבלה.
    let ownerSnap = null;
    if (template.ownerId) {
      ownerSnap = await db.collection('users').doc(template.ownerId).get();
      if (ownerSnap.exists && (ownerSnap.data().submissionCount || 0) >= 99) {
        showView('fill');
        errorEl.textContent = 'לא ניתן לקבל כרגע הגשות נוספות עבור טופס זה. אנא פנו לגורם ששלח לכם את הקישור.';
        return;
      }
    }

    const originalBytes = await getPdfBytes(template);
    const values = {};
    const flattenedBytes = await flattenPdf(originalBytes, template.fields || [], (field) => {
      const rt = fieldRuntime[field.id];
      if (!rt) return null;
      const stamp = rt.getStamp();
      values[field.id] = stamp.kind === 'checkbox' ? stamp.checked : (stamp.kind === 'signature' ? true : stamp.value);
      return stamp;
    });

    flattenedBytesCache = flattenedBytes;
    const emailAttachmentOk = flattenedBytes.length <= EMAILJS_MAX_ATTACHMENT_BYTES;

    const submissionId = db.collection('submissions').doc().id;
    const submissionDoc = {
      id: submissionId,
      templateId: template.id,
      templateName: template.name,
      ownerId: template.ownerId,
      mode: 'single',
      status: 'completed',
      filledBy: fillerName,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      values: values
    };
    if (invitedEmail) submissionDoc.filledByEmail = invitedEmail;

    let pdfBase64 = null;
    let pdfUrl = null;
    let savedInSystem;
    if (template.pdfBase64) {
      // תבנית ישנה (Base64-in-Firestore) - שומרים באותה שיטה בדיוק.
      pdfBase64 = uint8ToBase64(flattenedBytes);
      savedInSystem = pdfBase64.length <= MAX_PDF_BASE64_BYTES;
      if (savedInSystem) submissionDoc.pdfBase64 = pdfBase64;
    } else {
      // תבנית חדשה (Firebase Storage) - אם המסמך המוטבע חורג מ-3MB, נשמור
      // בלי עותק במערכת (כמו נפילה למגבלה הישנה) במקום לנסות להעלות ולהיכשל.
      savedInSystem = flattenedBytes.length <= MAX_PDF_BYTES;
      if (savedInSystem) {
        const storagePath = 'submissions/' + submissionId + '/signed.pdf';
        const blob = new Blob([flattenedBytes], { type: 'application/pdf' });
        await storage.ref(storagePath).put(blob, { contentType: 'application/pdf' });
        pdfUrl = await storage.ref(storagePath).getDownloadURL();
        submissionDoc.pdfUrl = pdfUrl;
        submissionDoc.pdfStoragePath = storagePath;
      }
    }

    await db.collection('submissions').doc(submissionId).set(submissionDoc);

    if (ownerSnap && ownerSnap.exists) {
      db.collection('users').doc(template.ownerId).update({
        submissionCount: firebase.firestore.FieldValue.increment(1)
      }).catch(err => console.warn('עדכון מונה ההגשות נכשל:', err));
    }

    sendEmailNotification(pdfBase64, pdfUrl, emailAttachmentOk).catch(err => console.warn('שליחת מייל ההתראה נכשלה (ההגשה עצמה נשמרה בהצלחה):', err));

    showSuccessScreen({ title: 'הטופס נשלח בהצלחה', status: 'עותק חתום נשמר במערכת.', bytes: flattenedBytes, savedInSystem });
  } catch (err) {
    showView('fill');
    document.getElementById('validation-error').textContent = 'שגיאה בשליחת הטופס: ' + err.message;
  }
}

// ─── שליחת חתימה: מצב multiSign (מסמך משותף, כמה חותמים) ───
async function submitMultiSignMode() {
  const errorEl = document.getElementById('validation-error');
  const missing = validateRequired();
  if (missing.length) {
    errorEl.textContent = 'נא למלא: ' + missing.join(', ');
    return;
  }
  errorEl.textContent = '';
  showView('submitting');

  try {
    const signatureFields = (template.fields || []).filter(f => f.type === 'signature');
    const myField = signatureFields.find(f => f.id === multiSign.signerFieldId);
    const myStamp = fieldRuntime[myField.id].getStamp();
    const mySignatureBase64 = myStamp.dataUrl.replace(/^data:image\/png;base64,/, '');

    const myValues = {};
    (template.fields || []).forEach(field => {
      if (field.type === 'signature') return;
      const rt = fieldRuntime[field.id];
      if (!rt || rt.readOnly) return; // כבר קיים - לא שלי למלא
      const stamp = rt.getStamp();
      myValues[field.id] = stamp.kind === 'checkbox' ? stamp.checked : stamp.value;
    });

    const submissionRef = db.collection('submissions').doc(multiSign.submissionId);
    let completionResult = null;

    await db.runTransaction(async (tx) => {
      const snap = await tx.get(submissionRef);
      if (!snap.exists) throw new Error('סבב החתימות לא נמצא.');
      const data = snap.data();
      if (data.status !== 'in_progress') throw new Error('ALREADY_HANDLED');

      const update = {};
      update['signerNames.' + myField.id] = fillerName;
      update['rawSignatures.' + myField.id] = mySignatureBase64;

      const mergedValues = Object.assign({}, data.values || {});
      Object.keys(myValues).forEach((k) => {
        if (!(k in mergedValues)) { mergedValues[k] = myValues[k]; update['values.' + k] = myValues[k]; }
      });

      const mergedRawSignatures = Object.assign({}, data.rawSignatures || {});
      mergedRawSignatures[myField.id] = mySignatureBase64;
      const allSigned = signatureFields.every(f => !!mergedRawSignatures[f.id]);

      update.status = allSigned ? 'completing' : 'in_progress';
      if (allSigned) completionResult = { values: mergedValues, rawSignatures: mergedRawSignatures };
      tx.update(submissionRef, update);
    });

    if (completionResult) {
      const originalBytes = await getPdfBytes(template);
      const flattenedBytes = await flattenPdf(originalBytes, template.fields || [], (field) => {
        if (field.type === 'signature') {
          const raw = completionResult.rawSignatures[field.id];
          return raw ? { kind: 'signature', dataUrl: 'data:image/png;base64,' + raw } : null;
        }
        const val = completionResult.values[field.id];
        if (field.type === 'checkbox') return { kind: 'checkbox', checked: !!val };
        if (val === undefined || val === null || val === '') return null;
        return { kind: 'text', value: val };
      });

      flattenedBytesCache = flattenedBytes;
      const emailAttachmentOk = flattenedBytes.length <= EMAILJS_MAX_ATTACHMENT_BYTES;

      const finalUpdate = {
        status: 'completed',
        completedAt: firebase.firestore.FieldValue.serverTimestamp(),
        rawSignatures: firebase.firestore.FieldValue.delete()
      };

      let pdfBase64 = null;
      let pdfUrl = null;
      let savedInSystem;
      if (template.pdfBase64) {
        pdfBase64 = uint8ToBase64(flattenedBytes);
        savedInSystem = pdfBase64.length <= MAX_PDF_BASE64_BYTES;
        if (savedInSystem) finalUpdate.pdfBase64 = pdfBase64;
      } else {
        savedInSystem = flattenedBytes.length <= MAX_PDF_BYTES;
        if (savedInSystem) {
          const storagePath = 'submissions/' + multiSign.submissionId + '/signed.pdf';
          const blob = new Blob([flattenedBytes], { type: 'application/pdf' });
          await storage.ref(storagePath).put(blob, { contentType: 'application/pdf' });
          pdfUrl = await storage.ref(storagePath).getDownloadURL();
          finalUpdate.pdfUrl = pdfUrl;
          finalUpdate.pdfStoragePath = storagePath;
        }
      }
      await submissionRef.update(finalUpdate);

      sendEmailNotification(pdfBase64, pdfUrl, emailAttachmentOk).catch(err => console.warn('שליחת מייל ההתראה נכשלה:', err));

      showSuccessScreen({ title: 'המסמך הושלם', status: 'כל החתימות נאספו ועותק חתום נשמר במערכת.', bytes: flattenedBytes, savedInSystem });
    } else {
      showSuccessScreen({ title: 'החתימה שלך נשמרה', status: 'ממתינים לחתימות נוספות לפני שהמסמך יושלם.', bytes: null, savedInSystem: true });
    }
  } catch (err) {
    if (err.message === 'ALREADY_HANDLED') {
      document.querySelector('#view-invalid p').textContent = 'החתימה הזו כבר בוצעה, או שסבב החתימות הסתיים.';
      showView('invalid');
      return;
    }
    showView('fill');
    document.getElementById('validation-error').textContent = 'שגיאה בשליחת החתימה: ' + err.message;
  }
}

async function sendEmailNotification(pdfBase64, pdfUrl, includeAttachment) {
  if (!EMAILJS_CONFIG.publicKey || EMAILJS_CONFIG.publicKey.startsWith('PASTE')) return;
  const params = {
    to_email: template.notifyEmail || ADMIN_EMAIL,
    template_name: template.name,
    filler_name: fillerName,
    submitted_at: new Date().toLocaleString('he-IL')
  };
  if (includeAttachment && pdfBase64) {
    params.pdf_attachment = 'data:application/pdf;base64,' + pdfBase64;
  }
  if (pdfUrl) {
    params.pdf_link = pdfUrl;
  }
  await emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, params);
}

function showSuccessScreen({ title, status, bytes, savedInSystem }) {
  document.getElementById('success-name').textContent = fillerName;
  document.getElementById('success-title').textContent = title;
  document.getElementById('success-status').textContent = status;
  const link = document.getElementById('download-link');
  if (bytes) {
    const blob = new Blob([bytes], { type: 'application/pdf' });
    link.href = URL.createObjectURL(blob);
    link.download = (template.name || 'document') + '.pdf';
    link.style.display = 'inline-block';
  } else {
    link.style.display = 'none';
  }
  document.getElementById('success-note').textContent = (bytes && !savedInSystem)
    ? 'שימו לב: הקובץ היה גדול מדי לשמירה במערכת - הקפידו להוריד עותק כעת.'
    : '';
  showView('success');
}

// ─── אתחול ───────────────────────────────────────────────
document.getElementById('start-fill-btn').addEventListener('click', async () => {
  const nameInput = document.getElementById('filler-name-input');
  const name = nameInput.value.trim();
  if (!name) {
    document.getElementById('name-error').textContent = 'נא להזין שם.';
    nameInput.focus();
    return;
  }
  fillerName = name;
  showView('fill');
  try {
    await renderFillDocument();
  } catch (err) {
    document.getElementById('validation-error').textContent = 'שגיאה בטעינת המסמך: ' + err.message;
  }
});

async function init() {
  const params = new URLSearchParams(location.search);
  templateId = params.get('id');
  const submissionId = params.get('submission');
  const signerFieldId = params.get('signer');
  invitedEmail = params.get('e');
  const invitedName = params.get('n');
  if (!templateId) { showView('invalid'); return; }

  await loadScripts(FIREBASE_SDK_URLS);
  const services = await fbInit();
  db = services.db; auth = services.auth; storage = services.storage;

  await loadPdfJs();
  await loadScripts([PDF_LIB_SCRIPT_URL, EMAILJS_SCRIPT_URL]);
  if (typeof emailjs !== 'undefined' && EMAILJS_CONFIG.publicKey && !EMAILJS_CONFIG.publicKey.startsWith('PASTE')) {
    emailjs.init({ publicKey: EMAILJS_CONFIG.publicKey });
  }

  await auth.signInAnonymously();

  const doc = await db.collection('templates').doc(templateId).get();
  if (!doc.exists || doc.data().active === false) { showView('invalid'); return; }
  template = Object.assign({ id: doc.id }, doc.data());

  let modalTitle = template.name;

  if (submissionId || signerFieldId) {
    if (template.mode !== 'multiSign' || !submissionId || !signerFieldId) { showView('invalid'); return; }
    const signerField = (template.fields || []).find(f => f.id === signerFieldId && f.type === 'signature');
    if (!signerField) { showView('invalid'); return; }

    const subDoc = await db.collection('submissions').doc(submissionId).get();
    if (!subDoc.exists) { showView('invalid'); return; }
    const subData = subDoc.data();
    if (subData.status !== 'in_progress' || (subData.rawSignatures && subData.rawSignatures[signerFieldId])) {
      document.querySelector('#view-invalid p').textContent = 'החתימה הזו כבר בוצעה, או שסבב החתימות הסתיים.';
      showView('invalid');
      return;
    }

    multiSign = { submissionId, signerFieldId, data: subData };
    modalTitle = template.name + ' — חתימת ' + signerField.label;
  }

  document.getElementById('page-title').textContent = template.name;
  document.getElementById('name-modal-title').textContent = modalTitle;
  if (invitedName) document.getElementById('filler-name-input').value = invitedName;
  showView('name-modal');
}

init().catch(err => {
  document.body.innerHTML = '<div style="padding:2rem">שגיאה בטעינת הטופס: ' + err.message + '</div>';
});
</script>
